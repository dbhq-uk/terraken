name: ci
on:
  push:
    branches: [main]
  pull_request:

# The default for every job below. A job that needs more declares it itself;
# an explicit floor here means a new job cannot silently inherit an org
# setting somebody widened.
permissions:
  contents: read

jobs:
  # THE SUITE RUNS ON ALL THREE OPERATING SYSTEMS GITHUB HOSTS, not just Linux.
  # The release ships sixteen platform builds and nothing had ever run the tests
  # on Windows or macOS, so "it builds there" was the only thing anyone knew.
  # That matters more than usual here: the renderer asks the terminal its width
  # and decides about colour, and both of those are exactly where a Unix
  # assumption hides.
  #
  # The other thirteen platforms have no hosted runner and are compile-only.
  # That is a real limit, and the cross-compile job below states it rather than
  # letting the green tick imply more than it means.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./... -race -cover

  # THE ONE GUARANTEE, RE-EARNED ON EVERY BUILD AND SAID OUT LOUD.
  #
  # "No attribute value ever reaches the output" is the claim the whole tool
  # rests on, and the README quotes a number from this job. A claim that size
  # should not be a paragraph somebody wrote once: it should be a count from
  # the run that produced this commit, printed where the build is.
  #
  # It is a separate job from `test` so the number is findable, and so that a
  # failure here reads as "the guarantee broke" rather than as one more red
  # line in a suite.
  leak-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
      - name: Plant credentials in every position a value can hide in
        run: |
          set -euo pipefail
          go test ./cmd/terraken/ -race \
            -run 'TestNoPlantedValueReachesAnyOutput|TestTheLeakDetectorCatchesALeak|TestEveryPlantedPosition|TestEveryFormatIsCoveredByTheLeakProof' \
            -v 2>&1 | tee proof.log
          # The count, lifted out of the run and put where a reader will find
          # it. grep -q first: a silent pass with no line to quote would mean
          # the proof had stopped reporting and nobody would notice.
          grep -q '^leak proof:' proof.log
          {
            echo '## The no-values guarantee'
            echo
            echo '```'
            grep '^leak proof' proof.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Every platform terraform ships for, compiled. It catches a build tag or an
  # import that only exists on Unix, which `go vet` on Linux cannot see, and it
  # is the check that keeps .goreleaser.yaml honest between releases - a
  # platform that stopped compiling would otherwise surface at tag time, in
  # public, with the tag already pushed.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
      - name: Build for every platform terraform runs on
        run: |
          set -euo pipefail
          # terraform 1.16.3's own platform table, which OpenTofu matches.
          PLATFORMS="darwin/amd64 darwin/arm64
                     linux/386 linux/amd64 linux/arm linux/arm64 linux/s390x
                     windows/386 windows/amd64 windows/arm64
                     freebsd/386 freebsd/amd64 freebsd/arm
                     openbsd/386 openbsd/amd64
                     solaris/amd64"
          FAIL=0
          COUNT=0
          for p in $PLATFORMS; do
            if GOOS="${p%/*}" GOARCH="${p#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/terraken; then
              echo "ok    $p"
            else
              echo "FAIL  $p"; FAIL=1
            fi
            COUNT=$((COUNT + 1))
          done
          # A loop that matched nothing would pass silently, which would make
          # this job decoration rather than a check.
          [ "$COUNT" -eq 16 ] || { echo "expected 16 platforms, tried $COUNT"; exit 1; }
          [ "$FAIL" = "0" ]
      - run: gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt

  # The release config is only exercised when a tag is pushed, which is
  # the worst moment to find out it is broken - the tag already exists
  # and the release has already failed in public. Validate it on every
  # pull request instead.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Pinned to the same major as the release workflow. An
          # unpinned check would validate the config against a different
          # goreleaser from the one that ships it, which is no check at
          # all.
          version: '~> v2'
          args: check

  action:
    # The composite action had never actually been run. It is the route the
    # README tells people to use in CI, so it gets exercised on every push
    # rather than discovered to be broken by whoever tries it first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.23'

      - name: a clean plan passes
        uses: ./
        with:
          plan: testdata/minimal.json
          summary: 'false'

      - name: a critical plan gates when asked to
        id: gate
        continue-on-error: true
        uses: ./
        with:
          plan: testdata/critical.json
          fail-on: critical
          summary: 'false'

      - name: the gate must have fired
        run: |
          if [ "${{ steps.gate.outcome }}" != "failure" ]; then
            echo "--fail-on critical did not fail on a plan with a critical finding"
            exit 1
          fi
          echo "gate fired as expected"

      - name: the summary is written when asked for
        uses: ./
        with:
          plan: testdata/demo.json
          summary: 'true'

  site:
    # terraken.dbhq.uk lives in site/ and its tests read the Go source in this
    # repository - the flag names, the four levels, the annotation codes. That
    # is why the site is here rather than in the DBHQ monorepo, and it only
    # works if this job runs on every push rather than on a schedule somewhere
    # else.
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the build derives the sitemap's <lastmod> from
      # git history (site/src/lib/content-dates.mjs, 20 Sep 2026), and refuses
      # to run on a shallow clone rather than publishing one date for every
      # page. deploy-site.yml carries the same setting for the same reason.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
