version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore"
    groups:
      gomod:
        patterns:
          - "*"

  # The composite action in this repository pins the actions it uses, and CI
  # runs the action on every push, so an update here is exercised rather than
  # merged on trust.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
    # golang.org/x/term and x/sys raise their own Go floor aggressively -
    # x/sys v0.48.0 requires Go 1.26 for what this project uses only to
    # read a terminal width. Letting that through sets the same floor on
    # anyone running "go install", which is this tool's primary install
    # route. Hold both at the last release that still builds on Go 1.23.
    ignore:
      - dependency-name: "golang.org/x/term"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "golang.org/x/sys"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
