name: terrakit
description: Rank what a Terraform or OpenTofu plan actually does, by risk
inputs:
  plan:
    description: Path to plan JSON from "terraform show -json", or - for stdin
    required: true
  fail-on:
    description: Exit 1 if any finding reaches this level - critical, high, low or info
    required: false
    default: ''
  summary:
    description: Append the markdown report to the job summary
    required: false
    default: 'true'
  version:
    description: >-
      Version of terrakit to install. Defaults to the ref this action was
      pinned at, so dbhq-uk/terrakit@v0.2.0 installs v0.2.0
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      # Inputs arrive as environment variables and are read as "$PLAN",
      # never interpolated into the script text. A ${{ }} expression is
      # substituted before bash ever sees the line, so a caller wiring
      # plan: from a pull request title or a branch name could otherwise
      # close the quote and run anything it liked on the runner.
      env:
        PLAN: ${{ inputs.plan }}
        FAIL_ON: ${{ inputs.fail-on }}
        SUMMARY: ${{ inputs.summary }}
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        # The version defaults to the ref the caller pinned this action at,
        # so dbhq-uk/terrakit@v0.2.0 installs the binary from v0.2.0
        # and the two can never disagree. Hard-coding a default here meant
        # every release had to bump a pin inside itself, which is a step
        # that gets forgotten and then silently ships the wrong binary.
        #
        # Still never @latest: a released action must not change what it
        # runs because someone pushed to main. If the ref is a branch or a
        # SHA rather than a tag, fall back to the latest release instead of
        # guessing - @main would install unreleased code.
        ref="${VERSION:-$ACTION_REF}"
        case "$ref" in
          v[0-9]*) ;;
          *) ref=$(curl -fsSL https://api.github.com/repos/dbhq-uk/terrakit/releases/latest \
                    | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p') ;;
        esac
        echo "installing terrakit ${ref}"
        go install "github.com/dbhq-uk/terrakit/cmd/terrakit@${ref}"

        args=(--format md)
        if [ -n "$FAIL_ON" ]; then
          args+=(--fail-on "$FAIL_ON")
        fi

        # One run, not two. The same output becomes the job summary and
        # the same exit code becomes the gate, so the two can never
        # disagree, and a large plan is not assessed twice. -- stops a
        # path beginning with a dash being read as a flag.
        set +e
        report=$(terrakit "${args[@]}" -- "$PLAN")
        status=$?
        set -e

        printf '%s\n' "$report"
        if [ "$SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
